name: Refresh PR snapshot

# Keeps data/snapshot.json fresh so the page still has recent data when a
# visitor hits the GitHub API rate limit. The page itself always tries the
# live API first.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-prs.sh
      - name: Commit if changed
        run: |
          # Only commit when the PR list itself changed, not just the timestamp.
          if git diff --quiet -- data/snapshot.json || \
             diff <(git show HEAD:data/snapshot.json | jq -S .prs) <(jq -S .prs data/snapshot.json) >/dev/null; then
            echo "No PR changes"; git checkout -- data/snapshot.json; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "chore: refresh PR snapshot"
          git push
